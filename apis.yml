name: Keynua
description: Keynua is a Latin American digital identity and electronic signature platform
  that lets businesses design signing flows combining video, drawn, OTP, and digital
  signatures with biometric identity verification — liveness detection, facial matching,
  3D and selfie identification, and geopositioning. Its REST API covers contracts,
  document templates, identity verification, OTP, and Deceval promissory notes, delivering
  requests to signers over WhatsApp, SMS, or email and emitting webhooks for asynchronous
  processing events. It supports 20+ Latin American identity documents across 20 countries
  and serves financial services, real estate, human resources, commercial contracts,
  and sports betting.
